<!doctype html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flavortown Wishlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-[#f6e7c8] to-[#e8d4a8] min-h-screen flex flex-col">
<!-- LOGIN -->
<div id="login" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white/90 backdrop-blur p-8 rounded-2xl w-full max-w-md shadow-2xl border-2 border-[#c88a3d]">
        <h1 class="text-3xl font-bold mb-6 text-[#c88a3d] text-center">🍪 Flavortown</h1>
        <input
                id="uid"
                type="number"
                placeholder="User ID"
                class="w-full mb-3 px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-[#c88a3d] focus:outline-none transition"
        />
        <input
                id="apikey"
                type="password"
                placeholder="API Key"
                class="w-full mb-4 px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-[#c88a3d] focus:outline-none transition"
        />
        <button
                id="loginBtn"
                class="w-full bg-[#8bbf4d] py-3 rounded-lg font-bold text-white hover:bg-[#7aa63d] transition shadow-lg"
        >
            Login
        </button>
    </div>
</div>

<!-- APP -->
<div id="app" class="hidden flex-1 flex flex-col">
    <div class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
        <!-- Header -->
        <div class="bg-white/90 backdrop-blur rounded-2xl p-6 mb-6 shadow-lg border-2 border-[#c88a3d]">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-[#c88a3d]">🍪 Flavortown Store</h1>
                <button id="logout" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
                    Log out
                </button>
            </div>
        </div>

        <div class="flex gap-6">
            <!-- Filters & Wishlist - Sticky Column -->
            <div class="w-full lg:w-96 flex-shrink-0">
                <div class="sticky top-4 space-y-6">
                    <!-- Filtry -->
                    <div class="bg-white/90 backdrop-blur rounded-2xl p-6 shadow-lg border-2 border-[#c88a3d]">
                        <h2 class="text-xl font-bold mb-4 text-[#c88a3d]">🔍 Filters</h2>

                        <input
                                id="searchInput"
                                type="text"
                                placeholder="Search products..."
                                class="w-full mb-4 px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-[#c88a3d] focus:outline-none transition"
                        />

                        <div class="mb-4">
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Price (max 🍪)</label>
                            <input
                                    id="priceRange"
                                    type="range"
                                    min="0"
                                    max="5000"
                                    value="5000"
                                    class="w-full"
                            />
                            <div class="flex justify-between text-sm text-gray-600 mt-1">
                                <span>0</span>
                                <span id="priceValue" class="font-bold text-[#c88a3d]">5000</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Sort by</label>
                            <select
                                    id="sortSelect"
                                    class="w-full px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-[#c88a3d] focus:outline-none transition"
                            >
                                <option value="name-asc">Name A-Z</option>
                                <option value="name-desc">Name Z-A</option>
                                <option value="price-asc">Price ↑</option>
                                <option value="price-desc">Price ↓</option>
                            </select>
                        </div>

                        <div>
                            <label class="flex items-center cursor-pointer">
                                <input
                                        id="limitedOnly"
                                        type="checkbox"
                                        class="mr-2 w-4 h-4"
                                />
                                <span class="text-sm font-semibold text-gray-700">Limited only</span>
                            </label>
                        </div>
                    </div>

                    <!-- Wishlist -->
                    <div class="bg-white/90 backdrop-blur rounded-2xl p-6 shadow-lg border-2 border-[#c88a3d] max-h-[60vh] overflow-y-auto">
                        <h2 class="text-xl font-bold mb-4 text-[#c88a3d] sticky top-0 bg-white/90 pb-2">🎁 Wishlist</h2>

                        <div id="wishlistEmpty" class="text-center py-8 text-gray-400">
                            Your wishlist is empty
                        </div>
                        <ul id="wishlist" class="space-y-2 mb-4"></ul>

                        <div class="border-t-2 border-gray-200 pt-4 space-y-2 sticky bottom-0 bg-white/90 mt-4">
                            <div class="flex justify-between">
                                <span class="font-semibold">You need:</span>
                                <span id="needed" class="font-bold text-[#c88a3d]">0 🍪</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="font-semibold">You have:</span>
                                <span id="owned" class="font-bold text-green-600">0 🍪</span>
                            </div>
                            <div id="diff" class="text-center font-bold text-lg pt-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Store -->
            <div class="flex-1 min-w-0">
                <div id="storeLoading" class="text-center py-12 text-gray-500">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#c88a3d] mx-auto mb-4"></div>
                    Loading store...
                </div>
                <div id="store" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
                <div id="noResults" class="hidden text-center py-12 text-gray-400">
                    No products found
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur border-t-2 border-[#c88a3d]/30 py-4 z-50">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <p class="text-gray-700">
            Made with 🍪 by
            <a href="https://github.com/mtj1337" target="_blank" rel="noopener noreferrer" class="text-[#c88a3d] hover:text-[#8bbf4d] font-semibold underline transition">
                matej
            </a>
        </p>
    </div>
</footer>

<script src="app.js"></script>
</body>
</html>
